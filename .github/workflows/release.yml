name: Release & Publish

# Privileged workflow_run handling: accept only this repository's master pushes.
# Verify the candidate against CI before checking it out; branch names alone do
# not establish trust. Build and tag the same verified SHA, never a moving branch.
# Consume only artifacts created here. Protect the pypi environment separately.

on:
  workflow_dispatch:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master]

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'master' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    outputs:
      publish: ${{ steps.version.outputs.publish }}
      tag: ${{ steps.version.outputs.tag }}
      sha: ${{ steps.verify.outputs.sha }}
    steps:
      # On workflow_run github.sha is trusted default-branch code, not the
      # triggering workflow's potentially untrusted head. Run policy from here.
      - name: Checkout release policy
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}

      - name: Verify release candidate passed trusted CI
        id: verify
        run: python3 scripts/verify_release.py
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ steps.verify.outputs.sha }}

      - name: Prepare verified release tag
        id: version
        run: |
          VERSION=$(python3 -c "import tomllib; f=open('pyproject.toml','rb'); v=tomllib.load(f)['project']['version']; f.close(); print(v)")
          TAG="v$VERSION"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG"; then
            git fetch --no-tags origin "refs/tags/$TAG:refs/tags/$TAG"
            if [ "$(git rev-parse "$TAG^{commit}")" != "$RELEASE_SHA" ]; then
              # Ordinary commits after a release keep its version until bumped.
              echo "Version $VERSION belongs to another commit; nothing to publish."
              echo "publish=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          else
            STATUS=$?
            # ls-remote returns 2 for an absent ref; transport failures are fatal.
            if [ "$STATUS" -ne 2 ]; then exit "$STATUS"; fi
            gh release create "$TAG" --target "$RELEASE_SHA" --title "$TAG" --generate-notes
            git fetch --no-tags origin "refs/tags/$TAG:refs/tags/$TAG"
          fi
          test "$(git rev-parse "$TAG^{commit}")" = "$RELEASE_SHA"
          # An existing matching tag may represent a failed/partial publication.
          echo "publish=true" >> "$GITHUB_OUTPUT"
        env:
          RELEASE_SHA: ${{ steps.verify.outputs.sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    needs: release
    if: needs.release.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      attestations: write
      id-token: write
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.release.outputs.sha }}

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      - name: Validate version matches tag
        env:
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          VERSION=$(python3 -c "import tomllib; f=open('pyproject.toml','rb'); v=tomllib.load(f)['project']['version']; f.close(); print(v)")
          if [ "v$VERSION" != "$TAG" ]; then
            echo "::error::Version mismatch: pyproject.toml has $VERSION but tag is $TAG"
            exit 1
          fi
          echo "Version $VERSION matches tag $TAG"

      - name: Build sdist and wheel
        run: uv build

      - name: Generate checksums
        run: sha256sum dist/* > dist/checksums.sha256

      - name: Attest build provenance
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-path: 'dist/*'

      - name: Upload artifacts
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Verify checksums
        run: sha256sum --check dist/checksums.sha256 && rm dist/checksums.sha256

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@ed0c53931b1dc9bd32cbe73a98c7f6766f8a527e # v1.13.0
        with:
          # PyPI files are immutable; retries upload only missing distributions.
          skip-existing: true
